services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: ${DB_PASSWORD:-localdev}
    ports:
      # 5434 on the host, because 5432 and 5433 are already taken on this machine
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
