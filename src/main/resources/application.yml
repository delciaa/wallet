spring:
  application:
    name: wallet
  config:
    # Local secrets such as JWT_SECRET live in .env, which git ignores
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5434/wallet
    username: wallet
    password: ${DB_PASSWORD:localdev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:}
    ttl: 15m
    issuer: wallet
