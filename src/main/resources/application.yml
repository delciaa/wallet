spring:
  application:
    name: wallet
  config:
    # Local secrets such as JWT_SECRET live in .env, which git ignores
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5434/wallet
    username: wallet
    password: ${DB_PASSWORD:localdev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # Update rows in ID order, so two transfers between the same pair of
        # wallets lock them in the same order and can't deadlock each other
        order_updates: true
  mvc:
    problemdetails:
      enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:}
    ttl: 15m
    issuer: wallet

  admin:
    # The account to make admin at startup. It must sign up first.
    email: ${ADMIN_EMAIL:}
